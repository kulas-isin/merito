<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merito — 客戶管理系統</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

<header>
  <div class="masthead">
    <div class="brand">Merit<span class="dot">o</span></div>
    <div class="head-right">
      <div class="tagline">Client Management</div>
      <div class="sync-chip" id="syncChip" title="點擊同步">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">未設定同步</span>
      </div>
    </div>
  </div>
  <div class="sub">Know their merit before you commit — 值不值得接，先看 Merito。</div>
</header>

<nav class="tabs" id="tabs">
  <button data-v="dashboard" class="on"><span class="n">00</span>儀表板</button>
  <button data-v="clients"><span class="n">01</span>客戶</button>
  <button data-v="assess"><span class="n">02</span>接案評估</button>
  <button data-v="projects"><span class="n">03</span>專案追蹤</button>
  <button data-v="changes"><span class="n">04</span>需求異動</button>
  <button data-v="finance"><span class="n">05</span>報價收款</button>
  <button data-v="lessons"><span class="n">06</span>經驗記錄</button>
  <button data-v="settings"><span class="n">07</span>設定</button>
</nav>

<section class="view on" id="v-dashboard"></section>
<section class="view" id="v-clients"></section>
<section class="view" id="v-assess"></section>
<section class="view" id="v-projects"></section>
<section class="view" id="v-changes"></section>
<section class="view" id="v-finance"></section>
<section class="view" id="v-lessons"></section>
<section class="view" id="v-settings"></section>

<footer>
  MERITO · <span id="footStat">—</span> · 資料同步至 GitHub，未設定時僅存於本機瀏覽器
</footer>

</div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/assess.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/changes.js"></script>
<script src="js/views/finance.js"></script>
<script src="js/views/lessons.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
